<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LooLoo Kitchen</title>

<style>
:root{
  --green:#17372f;
  --green2:#21483e;
  --cream:#f4f0e7;
  --paper:#fffdf8;
  --gold:#b69b61;
  --ink:#1b211e;
  --muted:#737973;
  --line:#e4dfd3;
  --red:#a64b3d;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding:20px 16px 90px
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px
}

.brand{
  display:flex;
  gap:12px;
  align-items:center
}

.mark{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--green);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700;
  letter-spacing:.05em
}

.eyebrow{
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:.18em;
  color:var(--gold);
  font-weight:700
}

.title{
  font-family:Georgia,serif;
  font-size:24px;
  margin:2px 0
}

.date{
  font-size:12px;
  color:var(--muted)
}

.hero{
  background:var(--green);
  color:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 12px 30px #17372f1a
}

.hero h1{
  font-family:Georgia,serif;
  font-size:28px;
  margin:0 0 7px
}

.hero p{
  margin:0;
  color:#d8e0db;
  font-size:14px
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  background:#e8e3d8;
  padding:6px;
  border-radius:15px;
  margin-bottom:16px
}

.tab{
  border:0;
  background:transparent;
  border-radius:11px;
  padding:12px;
  font-weight:700;
  color:var(--muted);
  cursor:pointer
}

.tab.active{
  background:var(--paper);
  color:var(--green);
  box-shadow:0 2px 8px #0000000a
}

.panel{display:none}
.panel.active{display:block}

.summary{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:12px
}

.summary strong{
  font-size:20px
}

.summary span{
  font-size:12px;
  color:var(--muted)
}

.section{
  margin:14px 0
}

.section-title{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--muted);
  font-weight:800;
  margin:18px 4px 8px
}

.list{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 15px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition:.15s
}

.row:last-child{
  border-bottom:0
}

.row:hover{
  background:#faf7f0
}

.row.checked{
  background:#edf3ef
}

.box{
  width:23px;
  height:23px;
  border:1.5px solid #bcb8ad;
  border-radius:7px;
  flex:0 0 23px;
  display:grid;
  place-items:center;
  background:#fff
}

.row.checked .box{
  background:var(--green);
  border-color:var(--green);
  color:#fff
}

.box::after{
  content:'✓';
  font-size:14px;
  opacity:0
}

.row.checked .box::after{
  opacity:1
}

.name{
  font-size:14px
}

.row.checked .name{
  text-decoration:line-through;
  color:#7c827e
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#ffffffeb;
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:10px 16px;
  z-index:5
}

.bottom-inner{
  max-width:728px;
  margin:auto;
  display:flex;
  gap:8px
}

.select,
.send{
  height:48px;
  border-radius:13px;
  border:1px solid var(--line);
  padding:0 14px;
  font:inherit
}

.select{
  background:var(--paper);
  flex:1
}

.send{
  background:var(--green);
  color:white;
  border:0;
  font-weight:800;
  padding:0 18px;
  cursor:pointer
}

.send:disabled{
  opacity:.4;
  cursor:not-allowed
}

.clear{
  background:transparent;
  border:0;
  color:var(--muted);
  font-size:12px;
  cursor:pointer
}

.toast{
  position:fixed;
  left:50%;
  bottom:78px;
  transform:translateX(-50%) translateY(15px);
  background:var(--green);
  color:#fff;
  padding:12px 16px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:10;
  max-width:90%;
  text-align:center
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}

.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
  margin:10px 4px
}

.prep-progress{
  height:8px;
  background:#e5e1d7;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px
}

.prep-progress i{
  display:block;
  height:100%;
  width:0;
  background:var(--green);
  transition:.2s
}

@media(max-width:520px){
  .app{
    padding:16px 12px 86px
  }

  .hero{
    padding:19px
  }

  .hero h1{
    font-size:25px
  }

  .bottom-inner{
    gap:6px
  }

  .send{
    padding:0 13px
  }

  .select{
    min-width:0
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="brand">
    <div class="mark">LL</div>
    <div>
      <div class="eyebrow">LooLoo</div>
      <div class="title">Kitchen</div>
    </div>
  </div>

  <div class="date" id="date"></div>
</header>

<section class="hero">
  <h1>Кухня под контролем.</h1>
  <p>Отметь закупку и заготовки. Ничего лишнего.</p>
</section>

<div class="tabs">
  <button class="tab active" data-tab="prep">🥣 Заготовки</button>
  <button class="tab" data-tab="buy">🛒 Закупка</button>
</div>

<section id="prep" class="panel active">

  <div class="summary">
    <div>
      <strong id="prepCount">0/12</strong>
      <div class="date">заготовок выполнено</div>
    </div>

    <button class="clear" id="resetPrep">Сбросить</button>
  </div>

  <div class="prep-progress">
    <i id="prepBar"></i>
  </div>

  <div class="section">
    <div class="section-title">Сегодня</div>
    <div class="list" id="prepList"></div>
  </div>

  <div class="note">
    В V1 только отметка «сделано». Нормы по дням недели и контроль остатков добавим позже.
  </div>

</section>

<section id="buy" class="panel">

  <div class="summary">
    <div>
      <strong id="buyCount">0</strong>
      <div class="date">позиций отмечено</div>
    </div>

    <button class="clear" id="resetBuy">Сбросить</button>
  </div>

  <div id="buyList"></div>

</section>

</div>

<div class="bottom">

  <div class="bottom-inner">

    <select class="select" id="staff">
      <option value="">Кто отправляет?</option>
    </select>

    <button class="send" id="send" disabled>
      Отправить закупку
    </button>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

const GOOGLE_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbzWEJ-ZhQ2zqvaCMT-e9smfdt8yj_GRVN6HXQ8DRapk-tGtCIi7pcEfSfvStb2EU69r/exec';
const staff=[
  'Абраам',
  'Аркадий',
  'Арзуман',
  'Карина',
  'Айк',
  'Марине',
  'Нинель'
];

const prep=[
  'Рис',
  'Спайси соус',
  'Сырный соус',
  'Огурец — нарезка',
  'Яки соус',
  'Цезарь соус',
  'Рыбная нарезка — Филадельфия',
  'Рыбная нарезка — внутрянка',
  'Мароль — салат',
  'Креветки темпура',
  'Курица су-вид',
  'Курица маринованная'
];

const buy={

'🍚 Сухие продукты':[
  'Рис для суши',
  'Рисовый уксус',
  'Нори',
  'Панко',
  'Кунжут белый',
  'Кунжут чёрный',
  'Сахар',
  'Соль',
  'Растительное масло',
  'Кукурузный крахмал'
],

'🐟 Рыба и морепродукты':[
  'Лосось',
  'Креветка',
  'Крабовое мясо',
  'Кальмар',
  'Мидии',
  'Угорь'
],

'🥫 Соусы и азиатские продукты':[
  'Майонез',
  'Шрирача',
  'Соевый соус',
  'Унаги',
  'Терияки',
  'Sweet Chili',
  'Рыбный соус',
  'Мирин',
  'Васаби',
  'Маринованный имбирь',
  'Чука',
  'Кунжутный соус'
],

'🐟 Икра / топпинги':[
  'Масаго',
  'Тобико',
  'Каперсы',
  'Лук фри'
],

'🥬 Овощи и зелень':[
  'Огурец',
  'Помидор',
  'Листовой салат / мароль',
  'Авокадо',
  'Лук',
  'Чеснок'
],

'🧀 Молочные продукты':[
  'Сливочный сыр',
  'Чеддер',
  'Моцарелла',
  'Пармезан',
  'Сливки',
  'Молоко'
],

'🍔 Бургеры / горячее':[
  'Булочки для бургеров',
  'Куриное филе',
  'Картофель фри',
  'Яйца'
],

'🥣 Для новых блюд':[
  'Тыква',
  'Кокосовое молоко',
  'Паприка',
  'Лимон',
  'Лайм'
]

};

const key=(p)=>'llk_'+p;

const get=(p)=>
localStorage.getItem(key(p))==='1';

const set=(p,v)=>
localStorage.setItem(key(p),v?'1':'0');

const prepList=document.querySelector('#prepList');
const buyList=document.querySelector('#buyList');

function row(name,type){

  const r=document.createElement('div');

  r.className=
    'row'+
    (get(type+name)?' checked':'');

  r.innerHTML=
    '<div class="box"></div>'+
    '<div class="name"></div>';

  r.querySelector('.name').textContent=name;

  r.onclick=()=>{

    const v=!get(type+name);

    set(type+name,v);

    r.classList.toggle('checked',v);

    update();

  };

  return r;
}

function render(){

  prepList.innerHTML='';

  prep.forEach(x=>
    prepList.appendChild(
      row(x,'p_')
    )
  );

  buyList.innerHTML='';

  Object.entries(buy).forEach(
    ([cat,items])=>{

      const s=document.createElement('div');

      s.className='section';

      s.innerHTML=
        '<div class="section-title"></div>'+
        '<div class="list"></div>';

      s.querySelector('.section-title')
        .textContent=cat;

      items.forEach(x=>
        s.querySelector('.list')
          .appendChild(row(x,'b_'))
      );

      buyList.appendChild(s);

    }
  );

  const select=document.querySelector('#staff');

  select.innerHTML=
    '<option value="">Кто отправляет?</option>';

  staff.forEach(x=>{

    const o=document.createElement('option');

    o.value=x;
    o.textContent=x;

    select.appendChild(o);

  });

  update();

}

function update(){

  const pc=
    prep.filter(x=>get('p_'+x)).length;

  document.querySelector('#prepCount')
    .textContent=
    pc+'/'+prep.length;

  document.querySelector('#prepBar')
    .style.width=
    (pc/prep.length*100)+'%';

  let bc=0;

  Object.values(buy)
    .flat()
    .forEach(x=>{
      if(get('b_'+x))bc++;
    });

  document.querySelector('#buyCount')
    .textContent=bc;

  document.querySelector('#send').disabled=
    bc===0 ||
    !document.querySelector('#staff').value;

}

function toast(t){

  const x=document.querySelector('#toast');

  x.textContent=t;

  x.classList.add('show');

  setTimeout(
    ()=>x.classList.remove('show'),
    3000
  );

}

function reset(prefix,arr){

  arr.forEach(x=>
    set(prefix+x,false)
  );

  render();

}

document.querySelectorAll('.tab')
.forEach(b=>{

  b.onclick=()=>{

    document.querySelectorAll('.tab')
      .forEach(x=>
        x.classList.remove('active')
      );

    document.querySelectorAll('.panel')
      .forEach(x=>
        x.classList.remove('active')
      );

    b.classList.add('active');

    document.querySelector(
      '#'+b.dataset.tab
    ).classList.add('active');

  };

});

document.querySelector('#resetPrep')
.onclick=()=>reset('p_',prep);

document.querySelector('#resetBuy')
.onclick=()=>reset(
  'b_',
  Object.values(buy).flat()
);

document.querySelector('#staff')
.onchange=update;


/* =========================
   TELEGRAM / GOOGLE SCRIPT
   ========================= */

document.querySelector('#send')
.onclick=async()=>{

  const button=
    document.querySelector('#send');

  const who=
    document.querySelector('#staff').value;

  const items=
    Object.values(buy)
      .flat()
      .filter(x=>get('b_'+x));

  if(!who || !items.length)return;

  button.disabled=true;
  button.textContent='Отправляем…';

  try{

    const response=
      await fetch(
        GOOGLE_SCRIPT_URL,
        {
          method:'POST',
          headers:{
            'Content-Type':'text/plain;charset=utf-8'
          },
          body:JSON.stringify({
            employee:who,
            items:items
          })
        }
      );

    const result=
      await response.json();

    if(!result.success){

      throw new Error(
        result.error || 'Telegram error'
      );

    }

    toast('✓ Закупка отправлена в Telegram');

    items.forEach(x=>
      set('b_'+x,false)
    );

    render();

  }catch(error){

    console.error(error);

    toast(
      'Не удалось отправить заявку'
    );

    update();

  }finally{

    button.textContent=
      'Отправить закупку';

    update();

  }

};


/* =========================
   DATE
   ========================= */

document.querySelector('#date')
.textContent=
new Intl.DateTimeFormat(
  'ru-RU',
  {
    day:'2-digit',
    month:'2-digit',
    year:'numeric'
  }
).format(new Date());


render();

</script>

</body>
</html>
