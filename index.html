<meta charset="utf-8">

<meta

<title>LooLoo Kitchen</title>


<style>

:root{

  --green:#17372f;
  --green2:#21483e;

  --cream:#f4f0e7;
  --paper:#fffdf8;

  --gold:#b69b61;

  --ink:#1b211e;
  --muted:#737973;

  --line:#e4dfd3;

  --success:#2e6b50;

}


*{
  box-sizing:border-box;
}


body{

  margin:0;

  background:var(--cream);

  color:var(--ink);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


button,
select{

  font:inherit;

}


.app{

  max-width:760px;

  margin:auto;

  min-height:100vh;

  padding:
    20px
    16px
    110px;

}


/* =========================
   HEADER
   ========================= */

.top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:22px;

}


.brand{

  display:flex;

  gap:12px;

  align-items:center;

}


.mark{

  width:42px;
  height:42px;

  border-radius:12px;

  background:var(--green);

  color:white;

  display:grid;

  place-items:center;

  font-weight:700;

  letter-spacing:.05em;

}


.eyebrow{

  text-transform:uppercase;

  font-size:10px;

  letter-spacing:.18em;

  color:var(--gold);

  font-weight:700;

}


.title{

  font-family:Georgia,serif;

  font-size:24px;

  margin:2px 0;

}


.date{

  font-size:12px;

  color:var(--muted);

}


/* =========================
   HERO
   ========================= */

.hero{

  background:var(--green);

  color:white;

  border-radius:20px;

  padding:22px;

  margin-bottom:16px;

  box-shadow:
    0 12px 30px #17372f1a;

}


.hero h1{

  font-family:Georgia,serif;

  font-size:28px;

  margin:0 0 7px;

}


.hero p{

  margin:0;

  color:#d8e0db;

  font-size:14px;

}


/* =========================
   START SCREEN
   ========================= */

.start{

  display:block;

}


.start-title{

  font-family:Georgia,serif;

  font-size:24px;

  margin:
    24px
    0
    14px;

}


.start-grid{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

}


.start-card{

  border:1px solid var(--line);

  background:var(--paper);

  border-radius:18px;

  padding:20px;

  text-align:left;

  cursor:pointer;

  transition:.15s;

}


.start-card:hover{

  transform:translateY(-1px);

  box-shadow:
    0 8px 20px #0000000b;

}


.start-icon{

  font-size:28px;

  margin-bottom:10px;

}


.start-card strong{

  display:block;

  font-size:16px;

  margin-bottom:5px;

}


.start-card span{

  color:var(--muted);

  font-size:12px;

  line-height:1.4;

}


/* =========================
   EMPLOYEE
   ========================= */

.employee-screen{

  display:none;

}


.employee-title{

  font-family:Georgia,serif;

  font-size:24px;

  margin:
    24px
    0
    14px;

}


.employee-list{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;

}


.employee{

  border:1px solid var(--line);

  background:var(--paper);

  border-radius:14px;

  padding:15px;

  cursor:pointer;

  font-weight:700;

  text-align:left;

}


.employee:hover{

  border-color:var(--gold);

}


.back{

  border:0;

  background:transparent;

  color:var(--muted);

  padding:5px 0;

  cursor:pointer;

  font-size:13px;

}


/* =========================
   WORK SCREEN
   ========================= */

.work{

  display:none;

}


.work-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  margin-bottom:14px;

}


.work-title{

  font-family:Georgia,serif;

  font-size:24px;

}


.current-user{

  font-size:12px;

  color:var(--muted);

  margin-top:3px;

}


.change{

  border:1px solid var(--line);

  background:var(--paper);

  border-radius:10px;

  padding:8px 10px;

  cursor:pointer;

  font-size:12px;

}


/* =========================
   SUMMARY
   ========================= */

.summary{

  display:flex;

  justify-content:space-between;

  align-items:center;

  background:var(--paper);

  border:1px solid var(--line);

  border-radius:16px;

  padding:14px 16px;

  margin-bottom:12px;

}


.summary strong{

  font-size:20px;

}


.summary span{

  font-size:12px;

  color:var(--muted);

}


/* =========================
   PROGRESS
   ========================= */

.progress{

  height:8px;

  background:#e5e1d7;

  border-radius:10px;

  overflow:hidden;

  margin:
    0
    0
    16px;

}


.progress i{

  display:block;

  height:100%;

  width:0;

  background:var(--green);

  transition:.2s;

}


/* =========================
   SECTION
   ========================= */

.section{

  margin:14px 0;

}


.section-title{

  font-size:12px;

  text-transform:uppercase;

  letter-spacing:.12em;

  color:var(--muted);

  font-weight:800;

  margin:
    18px
    4px
    8px;

}


.list{

  background:var(--paper);

  border:1px solid var(--line);

  border-radius:16px;

  overflow:hidden;

}


/* =========================
   ROW
   ========================= */

.row{

  display:flex;

  align-items:center;

  gap:12px;

  padding:13px 15px;

  border-bottom:1px solid var(--line);

  cursor:pointer;

  transition:.12s;

}


.row:last-child{

  border-bottom:0;

}


.row:hover{

  background:#faf7f0;

}


.row.checked{

  background:#edf3ef;

}


.box{

  width:23px;
  height:23px;

  border:1.5px solid #bcb8ad;

  border-radius:7px;

  flex:0 0 23px;

  display:grid;

  place-items:center;

  background:white;

}


.box::after{

  content:'✓';

  font-size:14px;

  opacity:0;

}


.row.checked .box{

  background:var(--green);

  border-color:var(--green);

  color:white;

}


.row.checked .box::after{

  opacity:1;

}


.name{

  font-size:14px;

}


.row.checked .name{

  color:var(--green);

  font-weight:600;

}


/* =========================
   NOTE
   ========================= */

.note{

  font-size:12px;

  color:var(--muted);

  line-height:1.5;

  margin:
    10px
    4px;

}


/* =========================
   BOTTOM
   ========================= */

.bottom{

  display:none;

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:#ffffffeb;

  backdrop-filter:blur(12px);

  border-top:1px solid var(--line);

  padding:
    10px
    16px;

  z-index:5;

}


.bottom-inner{

  max-width:728px;

  margin:auto;

}


.send{

  width:100%;

  height:50px;

  border-radius:13px;

  border:0;

  background:var(--green);

  color:white;

  font-weight:800;

  cursor:pointer;

}


.send:disabled{

  opacity:.4;

  cursor:not-allowed;

}


/* =========================
   LOADING
   ========================= */

.sync{

  position:fixed;

  top:12px;

  left:50%;

  transform:
    translateX(-50%);

  background:var(--green);

  color:white;

  padding:
    7px
    12px;

  border-radius:20px;

  font-size:11px;

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:20;

}


.sync.show{

  opacity:1;

}


/* =========================
   TOAST
   ========================= */

.toast{

  position:fixed;

  left:50%;

  bottom:76px;

  transform:
    translateX(-50%)
    translateY(15px);

  background:var(--green);

  color:white;

  padding:
    12px
    16px;

  border-radius:12px;

  font-size:13px;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:30;

  max-width:90%;

  text-align:center;

}


.toast.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);

}


/* =========================
   MOBILE
   ========================= */

@media(max-width:520px){

  .app{

    padding:
      16px
      12px
      110px;

  }

  .hero{

    padding:19px;

  }

  .hero h1{

    font-size:25px;

  }

  .start-grid,
  .employee-list{

    grid-template-columns:1fr;

  }

}

</style>

</head>

  'Кола / Фанта / Спрайт',
  'Вода газированная',
  'Вода без газа'

];


/* Эмма */

const adminBuy = [

  'Соусники большие',
  'Соусники малые',

  'Супницы большие',
  'Супницы малые',

  'Салатники большие',
  'Салатники малые',

  'Пакеты для доставки — бумажные',
  'Пакеты для доставки — прозрачные',

  'Палочки для суши',

  'Салфетки для доставки',
  'Салфетки в зал'

];


/* =====================================================
   STATE
   ===================================================== */

let purpose = '';

let employee = null;

let prepState = {};

let selectedBuy = new Set();


/* =====================================================
   ELEMENTS
   ===================================================== */

const start =
  document.querySelector('#start');

const employeeScreen =
  document.querySelector('#employeeScreen');

const employeeList =
  document.querySelector('#employeeList');

const work =
  document.querySelector('#work');

const bottom =
  document.querySelector('#bottom');

const content =
  document.querySelector('#content');

const sendButton =
  document.querySelector('#send');

const toastEl =
  document.querySelector('#toast');

const syncEl =
  document.querySelector('#sync');


/* =====================================================
   DATE
   ===================================================== */

document.querySelector('#date')
  .textContent =
  new Intl.DateTimeFormat(
    'ru-RU',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric'
    }
  ).format(new Date());


/* =====================================================
   START PURPOSE
   ===================================================== */

document
  .querySelectorAll('.start-card')
  .forEach(button => {

    button.onclick = () => {

      purpose =
        button.dataset.purpose;

      showEmployees();

    };

  });


/* =====================================================
   EMPLOYEES
   ===================================================== */

function showEmployees(){

  start.style.display='none';

  employeeScreen.style.display='block';

  employeeList.innerHTML='';

  employees[purpose]
    .forEach(person => {

      const button =
        document.createElement('button');

      button.className='employee';

      button.textContent=
        person.name;

      button.onclick=()=>{

        employee=person;

        openWork();

      };

      employeeList.appendChild(button);

    });

}


document
  .querySelector('#backPurpose')
  .onclick=()=>{

    employeeScreen.style.display='none';

    start.style.display='block';

  };


document
  .querySelector('#changeUser')
  .onclick=()=>{

    work.style.display='none';

    bottom.style.display='none';

    employee=null;

    showEmployees();

  };


/* =====================================================
   OPEN WORK
   ===================================================== */

function openWork(){

  employeeScreen.style.display='none';

  start.style.display='none';

  work.style.display='block';

  bottom.style.display='block';

  document
    .querySelector('#workTitle')
    .textContent =
      purpose === 'prep'
        ? 'Заготовки'
        : 'Закупка';

  document
    .querySelector('#currentUser')
    .textContent =
      employee.name;

  selectedBuy.clear();

  renderWork();

  if(purpose==='prep'){

    loadPrepState();

  }

}


/* =====================================================
   GET PREP STATE
   ===================================================== */

function loadPrepState(){

  showSync(true);
  const callback = 'loolooPrep_' + Date.now();
  const script = document.createElement('script');
  let finished = false;
  const finish = (error, data) => {
    if(finished) return;
    finished = true;
    clearTimeout(timer);
    delete window[callback];
    script.remove();
    showSync(false);
    if(error){
      console.error(error);
      toast('Не удалось обновить состояние.');
      return;
    }
    if(data && data.success){
      prepState = data.prepState || {};
      renderWork();
    }
  };
  const timer = setTimeout(() => finish(new Error('Тайм-аут загрузки')), 10000);
  window[callback] = data => finish(null, data);
  script.onerror = () => finish(new Error('Ошибка загрузки'));
  script.src = GOOGLE_SCRIPT_URL + '?callback=' + callback + '&t=' + Date.now();
  document.head.appendChild(script);
}


/* =====================================================
   PREP ITEMS
   ===================================================== */

function getPrepItems(){

  if(employee.role==='prep'){
    return prepLists.prep;
  }

  if(employee.role==='admin'){
    return prepLists.admin;
  }

  if(employee.role==='sushi'){
    return prepLists.sushi;
  }

  return [];

}


/* =====================================================
   BUY ITEMS
   ===================================================== */

function getBuyItems(){

  if(employee.role==='kitchen'){

    return kitchenBuy;

  }


  if(employee.role==='bar'){

    return barBuy;

  }


  if(employee.role==='admin'){

    return adminBuy;

  }


  if(employee.role==='sushi'){

    return sushiBuy;

  }


  return [];

}


/* =====================================================
   RENDER
   ===================================================== */

function renderWork(){

  content.innerHTML='';

  if(purpose==='prep'){

    renderPrep();

  }else{

    renderBuy();

  }

}


/* =====================================================
   RENDER PREP
   ===================================================== */

function renderPrep(){

  const items =
    getPrepItems();

  const groups = {};

  items.forEach(item => {

    const group =
      item.group || 'Заготовки';

    if(!groups[group]){
      groups[group]=[];
    }

    groups[group].push(item);

  });


  Object.entries(groups)
    .forEach(([group,list]) => {

      const section =
        document.createElement('div');

      section.className='section';

      const title =
        document.createElement('div');

      title.className='section-title';

      title.textContent=group;

      const box =
        document.createElement('div');

      box.className='list';


      list.forEach(item => {

        const row =
          createPrepRow(item);

        box.appendChild(row);

      });


      section.appendChild(title);

      section.appendChild(box);

      content.appendChild(section);

    });


  updatePrepSummary();

}


/* =====================================================
   PREP ROW
   ===================================================== */

function createPrepRow(item){

  const row =
    document.createElement('div');

  const checked =
    prepState[item.name] === true;

  row.className =
    'row' +
    (checked ? ' checked' : '');


  const box =
    document.createElement('div');

  box.className='box';


  const name =
    document.createElement('div');

  name.className='name';

  name.textContent =
    item.name +
    (
      item.note
        ? ' · ' + item.note
        : ''
    );


  row.appendChild(box);

  row.appendChild(name);


  row.onclick=()=>{

    const newValue =
      !(
        prepState[item.name] === true
      );

    prepState[item.name]=newValue;

    row.classList.toggle(
      'checked',
      newValue
    );

    updatePrepSummary();

    savePrepToggle(
      item.name,
      newValue
    );

  };


  return row;

}


/* =====================================================
   SAVE PREP TO SERVER
   ===================================================== */

async function savePrepToggle(
  item,
  checked
){

  try{

    await fetch(
      GOOGLE_SCRIPT_URL,
      {
        method:'POST',

        mode:'no-cors',

        headers:{
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:JSON.stringify({

          action:'togglePrep',

          item:item,

          checked:checked

        })

      }
    );

  }catch(error){

    console.error(
      'Ошибка сохранения:',
      error
    );

  }

}


/* =====================================================
   PREP SUMMARY
   ===================================================== */

function updatePrepSummary(){

  const items =
    getPrepItems();

  const checked =
    items.filter(
      item =>
        prepState[item.name] === true
    ).length;

  document
    .querySelector('#count')
    .textContent =
      checked + '/' + items.length;


  const percentage =
    items.length
      ? checked / items.length * 100
      : 0;


  document
    .querySelector('#progressBar')
    .style.width =
      percentage + '%';


  sendButton.disabled =
    false;

  sendButton.textContent =
    'Отправить проверку';

}


/* =====================================================
   RENDER BUY
   ===================================================== */

function renderBuy(){

  const items =
    getBuyItems();

  const box =
    document.createElement('div');

  box.className='list';


  items.forEach(item => {

    const row =
      document.createElement('div');

    row.className='row';


    const check =
      document.createElement('div');

    check.className='box';


    const name =
      document.createElement('div');

    name.className='name';

    name.textContent=item;


    row.appendChild(check);

    row.appendChild(name);


    row.onclick=()=>{

      if(selectedBuy.has(item)){

        selectedBuy.delete(item);

        row.classList.remove(
          'checked'
        );

      }else{

        selectedBuy.add(item);

        row.classList.add(
          'checked'
        );

      }

      updateBuySummary();

    };


    box.appendChild(row);

  });


  content.appendChild(box);


  updateBuySummary();

}


/* =====================================================
   BUY SUMMARY
   ===================================================== */

function updateBuySummary(){

  const count =
    selectedBuy.size;

  document
    .querySelector('#count')
    .textContent =
      count;


  document
    .querySelector('#progressWrap')
    .style.display='none';


  sendButton.disabled =
    count===0;


  sendButton.textContent =
    'Отправить закупку';

}


/* =====================================================
   SEND
   ===================================================== */

sendButton.onclick =
  async()=>{

    if(!employee){
      return;
    }


    if(purpose==='prep'){

      await sendPrep();

    }else{

      await sendBuy();

    }

  };


/* =====================================================
   SEND PREP
   ===================================================== */

async function sendPrep(){

  const items =
    getPrepItems();


  const checkedItems =
    items
      .filter(
        item =>
          prepState[item.name] === true
      )
      .map(
        item => item.name
      );


  const uncheckedItems =
    items
      .filter(
        item =>
          prepState[item.name] !== true
      )
      .map(
        item => item.name
      );


  sendButton.disabled=true;

  sendButton.textContent=
    'Отправляем…';


  try{

    await fetch(
      GOOGLE_SCRIPT_URL,
      {
          method:'POST',
          mode:'no-cors',

          headers:{
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:JSON.stringify({

            action:'sendPrep',

            employee:
              employee.name,

            checkedItems:
              checkedItems,

            uncheckedItems:
              uncheckedItems

          })

        }
      );

    toast('✓ Запрос проверки отправлен');


  }catch(error){

    console.error(error);

    toast(
      'Не удалось отправить проверку'
    );

  }finally{

    updatePrepSummary();

  }

}


/* =====================================================
   SEND BUY
   ===================================================== */

async function sendBuy(){

  const items =
    Array.from(selectedBuy);


  if(!items.length){
    return;
  }


  sendButton.disabled=true;

  sendButton.textContent=
    'Отправляем…';


  try{

    await fetch(
      GOOGLE_SCRIPT_URL,
      {
          method:'POST',
          mode:'no-cors',

          headers:{
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:JSON.stringify({

            action:'sendBuy',

            employee:
              employee.name,

            items:items

          })

        }
      );

    toast('✓ Запрос закупки отправлен');


    selectedBuy.clear();

    renderBuy();


  }catch(error){

    console.error(error);

    toast(
      'Не удалось отправить закупку'
    );

  }finally{

    updateBuySummary();

  }

}


/* =====================================================
   TOAST
   ===================================================== */

function toast(text){

  toastEl.textContent=text;

  toastEl.classList.add('show');


  setTimeout(
    ()=>{
      toastEl.classList.remove(
        'show'
      );
    },
    3000
  );

}


/* =====================================================
   SYNC
   ===================================================== */

function showSync(show){

  syncEl.classList.toggle(
    'show',
    show
  );

}


/* =====================================================
   START
   ===================================================== */

renderWork();


</script>

</body>

</html>
