<html lang="ru">

<meta

<title>LooLoo Kitchen</title>


<style>

:root{
  --green:#17372f;
  --green2:#21483e;
  --cream:#f4f0e7;
  --paper:#fffdf8;
  --gold:#b69b61;
  --ink:#1b211e;
  --muted:#737973;
  --line:#e4dfd3;
  --red:#a64b3d;
  --softgreen:#edf3ef;
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif
}

button,
select,
input{
  font:inherit
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding:20px 16px 100px
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px
}

.brand{
  display:flex;
  gap:12px;
  align-items:center
}

.mark{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--green);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700;
  letter-spacing:.05em
}

.eyebrow{
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:.18em;
  color:var(--gold);
  font-weight:700
}

.title{
  font-family:Georgia,serif;
  font-size:24px;
  margin:2px 0
}

.date{
  font-size:12px;
  color:var(--muted)
}


/* START */

.start{
  padding-top:40px
}

.start h1{
  font-family:Georgia,serif;
  font-size:34px;
  margin:0 0 8px
}

.start p{
  color:var(--muted);
  margin:0 0 25px;
  font-size:14px
}

.start-grid{
  display:grid;
  gap:12px
}

.start-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  cursor:pointer;
  text-align:left;
  transition:.15s
}

.start-card:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 25px #17372f12
}

.start-card .icon{
  font-size:26px;
  margin-bottom:10px
}

.start-card strong{
  display:block;
  font-size:16px
}

.start-card span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:4px
}


/* ROLE */

.role-screen{
  display:none
}

.role-screen.active{
  display:block
}

.role-title{
  font-family:Georgia,serif;
  font-size:28px;
  margin:0 0 6px
}

.role-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px
}

.role-list{
  display:grid;
  gap:8px
}

.role-button{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  text-align:left;
  cursor:pointer;
  font-weight:700
}

.role-button:hover{
  background:#faf7f0
}

.back{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:0;
  margin-bottom:22px;
  cursor:pointer
}


/* APP */

.work{
  display:none
}

.work.active{
  display:block
}

.hero{
  background:var(--green);
  color:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 12px 30px #17372f1a
}

.hero h1{
  font-family:Georgia,serif;
  font-size:28px;
  margin:0 0 7px
}

.hero p{
  margin:0;
  color:#d8e0db;
  font-size:14px
}

.user-line{
  margin-top:14px;
  font-size:11px;
  color:#cbd8d1
}


/* SUMMARY */

.summary{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:12px
}

.summary strong{
  font-size:20px
}


/* LIST */

.section{
  margin:14px 0
}

.section-title{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--muted);
  font-weight:800;
  margin:18px 4px 8px
}

.list{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 15px;
  border-bottom:1px solid var(--line);
  cursor:pointer
}

.row:last-child{
  border-bottom:0
}

.row:hover{
  background:#faf7f0
}

.row.checked{
  background:var(--softgreen)
}

.box{
  width:23px;
  height:23px;
  border:1.5px solid #bcb8ad;
  border-radius:7px;
  flex:0 0 23px;
  display:grid;
  place-items:center;
  background:#fff
}

.row.checked .box{
  background:var(--green);
  border-color:var(--green);
  color:#fff
}

.box::after{
  content:'✓';
  font-size:14px;
  opacity:0
}

.row.checked .box::after{
  opacity:1
}

.name{
  font-size:14px;
  flex:1
}

.row.checked .name{
  text-decoration:line-through;
  color:#7c827e
}

.prep-meta{
  font-size:10px;
  color:var(--muted);
  white-space:pre-line;
  text-align:right
}


/* QUANTITY */

.quantity{
  display:flex;
  align-items:center;
  gap:5px;
  flex-shrink:0
}

.quantity button{
  width:28px;
  height:28px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  cursor:pointer
}

.quantity input{
  width:42px;
  height:28px;
  border:1px solid var(--line);
  border-radius:8px;
  text-align:center;
  background:#fff
}

.minimum{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-top:2px
}

.shortage{
  color:var(--red);
  font-weight:700
}


/* BUTTONS */

.action{
  width:100%;
  height:50px;
  border:0;
  border-radius:14px;
  background:var(--green);
  color:#fff;
  font-weight:800;
  cursor:pointer;
  margin-top:12px
}

.action:disabled{
  opacity:.4;
  cursor:not-allowed
}

.secondary{
  background:transparent;
  color:var(--muted);
  border:0;
  cursor:pointer;
  font-size:12px
}

.danger{
  color:var(--red)
}


/* WHATSAPP */

.whatsapp{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  margin-top:15px
}

.whatsapp-title{
  font-weight:800;
  font-size:13px;
  margin-bottom:8px
}

.whatsapp-text{
  font-size:12px;
  color:var(--muted);
  line-height:1.5
}

.whatsapp-button{
  width:100%;
  height:44px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#278b55;
  color:#fff;
  font-weight:800;
  cursor:pointer
}


/* FOOTER */

.bottom{
  margin-top:25px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.sync{
  font-size:11px;
  color:var(--muted)
}


/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:
    translateX(-50%)
    translateY(20px);
  background:var(--green);
  color:#fff;
  padding:12px 16px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:50;
  max-width:90%;
  text-align:center
}

.toast.show{
  opacity:1;
  transform:
    translateX(-50%)
    translateY(0)
}


/* MOBILE */

@media(max-width:520px){

  .app{
    padding:16px 12px 80px
  }

  .start{
    padding-top:25px
  }

  .start h1{
    font-size:30px
  }

  .hero{
    padding:19px
  }

  .hero h1{
    font-size:25px
  }

}

</style>

</section>

        group.title;

      list.appendChild(
        title
      );


      group.people.forEach(
        person => {

          const button =
            document.createElement(
              'button'
            );

          button.className =
            'role-button';

          button.textContent =
            person;

          button.onclick =
            () =>
              enterWork(
                person,
                group.title
              );

          list.appendChild(
            button
          );

        }
      );

    }
  );

}

/* =====================================================
   ENTER WORK
   ===================================================== */

function enterWork(
  employee,
  department
){

  currentEmployee =
    employee;

  currentDepartment =
    department;


  roleScreen.classList.remove(
    'active'
  );

  startScreen.style.display =
    'none';

  workScreen.classList.add(
    'active'
  );

    '#userLine'
  ).textContent =

/* =====================================================
   PREP TYPE
   ===================================================== */

function getPrepList(){

  if(
    employees.prep.includes(
      currentEmployee
    )
  ){

    return prepStaffList;

  }


  return sushiPrep;

}


/* =====================================================
   LOAD PREP STATE
   ===================================================== */

function loadPrepState(){

  const callbackName =
    'llooPrep_' +
    Date.now();


  window[callbackName] =
    function(data){

      try {

        if(
          data &&
          data.success
        ){

          prepState =
            data.prep || {};

          renderPrep();

          document.querySelector(
            '#syncStatus'
          ).textContent =
            '✓ Синхронизировано';

        }

      } catch(error){

        console.error(error);

      }


      const script =
        document.getElementById(
          callbackName
        );

      if(script){
        script.remove();
      }

      delete window[
        callbackName
      ];

    };


  const script =
    document.createElement(
      'script'
    );

  script.id =
    callbackName;


  script.src =
    GOOGLE_SCRIPT_URL +
    '?callback=' +
    callbackName +
    '&t=' +
    Date.now();


  script.onerror =
    function(){

      document.querySelector(
        '#syncStatus'
      ).textContent =
        '⚠ Ошибка синхронизации';

      script.remove();

      delete window[
        callbackName
      ];

    };


  document
    .body
    .appendChild(script);

}


/* =====================================================
   POST
   ===================================================== */

function post(data){

  return fetch(
    GOOGLE_SCRIPT_URL,
    {
      method:'POST',

      mode:'no-cors',

      headers:{
        'Content-Type':
          'text/plain;charset=utf-8'
      },

      body:
        JSON.stringify(data)
    }
  );

}


/* =====================================================
   OPEN PREP
   ===================================================== */

function openPrep(){

  document.querySelector(
    '#workTitle'
  ).textContent =
    'Заготовки';

  document.querySelector(
    '#workSubtitle'
  ).textContent =
    'Отметь то, что уже готово.';


  document.querySelector(
    '#prepWork'
  ).style.display =
    'block';

  document.querySelector(
    '#buyWork'
  ).style.display =
    'none';


  loadPrepState();

}


/* =====================================================
   PREP ROW
   ===================================================== */

function createPrepRow(item){

  const info =
    prepState[item];


  const row =
    document.createElement(
      'div'
    );

  row.className =
    'row' +
    (
      info
        ? ' checked'
        : ''
    );


  const box =
    document.createElement(
      'div'
    );

  box.className =
    'box';


  const nameWrap =
    document.createElement(
      'div'
    );

  nameWrap.style.flex =
    '1';


  const name =
    document.createElement(
      'div'
    );

  name.className =
    'name';

  name.textContent =
    item;


  nameWrap.appendChild(
    name
  );


  if(minimums[item]){

    const min =
      document.createElement(
        'span'
      );

    min.className =
      'minimum';

    min.textContent =
      'Минимум: ' +
      minimums[item] +
      ' шт';

    nameWrap.appendChild(
      min
    );

  }


  row.appendChild(
    box
  );

  row.appendChild(
    nameWrap
  );


  if(
    minimums[item]
  ){

    const quantity =
      document.createElement(
        'div'
      );

    quantity.className =
      'quantity';


    const minus =
      document.createElement(
        'button'
      );

    minus.textContent =
      '−';


    const input =
      document.createElement(
        'input'
      );

    input.type =
      'number';

    input.min =
      '0';

    input.value =
      info &&
      info.quantity !== undefined
        ? info.quantity
        : '';


    const plus =
      document.createElement(
        'button'
      );

    plus.textContent =
      '+';


    minus.onclick =
      function(e){

        e.stopPropagation();

        let value =
          Number(
            input.value || 0
          );

        value =
          Math.max(
            0,
            value - 1
          );

        input.value =
          value;

        saveQuantity(
          item,
          value
        );

      };


    plus.onclick =
      function(e){

        e.stopPropagation();

        let value =
          Number(
            input.value || 0
          );

        value++;

        input.value =
          value;

        saveQuantity(
          item,
          value
        );

      };


    input.onclick =
      e =>
        e.stopPropagation();


    input.onchange =
      function(e){

        e.stopPropagation();

        saveQuantity(
          item,
          Number(
            this.value || 0
          )
        );

      };


    quantity.appendChild(
      minus
    );

    quantity.appendChild(
      input
    );

    quantity.appendChild(
      plus
    );


    row.appendChild(
      quantity
    );


    if(
      info &&
      Number(info.quantity) <
      minimums[item]
    ){

      row.classList.add(
        'shortage'
      );

    }

  } else {

    const meta =
      document.createElement(
        'div'
      );

    meta.className =
      'prep-meta';


    if(info){

      meta.textContent =
        info.employee +
        '\n' +
        info.time;

    }


    row.appendChild(
      meta
    );

  }


  row.onclick =
    function(){

      togglePrep(
        item
      );

    };


  return row;

}


/* =====================================================
   SAVE QUANTITY
   ===================================================== */

function saveQuantity(
  item,
  quantity
){

  if(
    quantity < 0
  ){
    quantity = 0;
  }


  const old =
    prepState[item];


  if(!old){

    prepState[item] = {

      checked:true,

      employee:
        currentEmployee,

      time:
        new Date()
          .toLocaleTimeString(
            'ru-RU',
            {
              hour:'2-digit',
              minute:'2-digit'
            }
          ),

      quantity:
        quantity

    };

  } else {

    old.quantity =
      quantity;

  }


  renderPrep();


  post({

    action:
      'prep_check',

    employee:
      currentEmployee,

    item:
      item,

    checked:true,

    quantity:
      quantity

  });


  document.querySelector(
    '#syncStatus'
  ).textContent =
    'Сохраняем…';


  setTimeout(
    loadPrepState,
    500
  );

}


/* =====================================================
   TOGGLE PREP
   ===================================================== */

function togglePrep(item){

  const current =
    prepState[item];


  const checked =
    !current;


  if(checked){

    prepState[item] = {

      checked:true,

      employee:
        currentEmployee,

      time:
        new Date()
          .toLocaleTimeString(
            'ru-RU',
            {
              hour:'2-digit',
              minute:'2-digit'
            }
          )

    };

  } else {

    delete prepState[item];

  }


  renderPrep();


  post({

    action:
      'prep_check',

    employee:
      currentEmployee,

    item:
      item,

    checked:
      checked

  });


  document.querySelector(
    '#syncStatus'
  ).textContent =
    'Сохраняем…';


  setTimeout(
    loadPrepState,
    500
  );

}


/* =====================================================
   RENDER PREP
   ===================================================== */

function renderPrep(){

  const list =
    document.querySelector(
      '#prepList'
    );


  list.innerHTML =
    '';


  const items =
    getPrepList();


  items.forEach(
    item =>
      list.appendChild(
        createPrepRow(item)
      )
  );


  const count =
    items.filter(
      item =>
        !!prepState[item]
    ).length;


  document.querySelector(
    '#prepCount'
  ).textContent =
    count +
    '/' +
    items.length;

}

   PREP REPORT

/* =====================================================
   RESET PREP

document

/* =====================================================
   PURCHASE LIST
   ===================================================== */

function getBuyList(){

  if(
    employees.bar.includes(
      currentEmployee
    )
  ){

    return barBuy;

  }


  if(
    employees.prep.includes(
      currentEmployee
    )
  ){

    return [
      ...new Set(
        prepBuy
      )
    ];

  }


  return [
    ...new Set(
      [
        ...sushiBuy,
        ...sushiSharedBuy
      ]
    )
  ];

}


/* =====================================================
   OPEN BUY
   ===================================================== */

function openBuy(){

  document.querySelector(
    '#workTitle'
  ).textContent =
    'Закупка';

  document.querySelector(
    '#workSubtitle'
  ).textContent =
    'Отметь только то, что нужно купить.';


  document.querySelector(
    '#prepWork'
  ).style.display =
    'none';

  document.querySelector(
    '#buyWork'
  ).style.display =
    'block';

    employees.bar.includes(
      currentEmployee
    );


  document.querySelector(
    '#barWhatsapp'
  ).style.display =
    isBar
      ? 'block'
      : 'none';


  renderBuy();

}


/* =====================================================
   BUY STORAGE
   ===================================================== */

function buyKey(item){

  return (
    'll_buy_v3_' +
    currentEmployee +
    '_' +
    item
  );

}


function buyGet(item){

  return (
    localStorage.getItem(
      buyKey(item)
    ) === '1'
  );

}


function buySet(
  item,
  value
){

  localStorage.setItem(
    buyKey(item),
    value
      ? '1'
      : '0'
  );

}


/* =====================================================
   BUY ROW
   ===================================================== */

function createBuyRow(item){

  const row =
    document.createElement(
      'div'
    );


  row.className =
    'row' +
    (
      buyGet(item)
        ? ' checked'
        : ''
    );


  const box =
    document.createElement(
      'div'
    );

  box.className =
    'box';


  const name =
    document.createElement(
      'div'
    );

  name.className =
    'name';

  name.textContent =
    item;


  row.appendChild(
    box
  );

  row.appendChild(
    name
  );


  row.onclick =
    function(){

      const value =
        !buyGet(item);


      buySet(
        item,
        value
      );


      row.classList.toggle(
        'checked',
        value
      );


      updateBuy();

    };


  return row;

}


/* =====================================================
   RENDER BUY
   ===================================================== */

function renderBuy(){

  const list =
    document.querySelector(
      '#buyList'
    );


  list.innerHTML =
    '';


  const items =
    getBuyList();


  const section =
    document.createElement(
      'div'
    );


  section.className =
    'list';


  items.forEach(
    item =>
      section.appendChild(
        createBuyRow(item)
      )
  );


  list.appendChild(
    section
  );


  updateBuy();

}


/* =====================================================
   UPDATE BUY
   ===================================================== */

function updateBuy(){

  const count =
    getBuyList()
      .filter(
        item =>
          buyGet(item)
      )
      .length;


  document.querySelector(
    '#buyCount'
  ).textContent =
    count;


  document.querySelector(
    '#buySend'
  ).disabled =
    count === 0;

}


/* =====================================================
   SEND BUY
   ===================================================== */

document
  .querySelector(
    '#buySend'
  )
  .onclick =
  function(){

    const items =
      getBuyList()
        .filter(
          item =>
            buyGet(item)
        );


    if(
      !items.length
    ){
      return;
    }


    const button =
      this;


    button.disabled =
      true;

    button.textContent =
      'Отправляем…';


    post({

      action:
        'purchase',

      employee:
        currentEmployee,

      department:
        currentDepartment,

      items:
        items

    });


    items.forEach(
      item =>
        buySet(
          item,
          false
        )
    );


    renderBuy();


    button.textContent =
      'Отправить закупку';


    toast(
      '✓ Закупка отправлена в Telegram'
    );

  };


/* =====================================================
   RESET BUY
   ===================================================== */

document
  .querySelector(
    '#resetBuy'
  )
  .onclick =
  function(){

    getBuyList()
      .forEach(
        item =>
          buySet(
            item,
            false
          )
      );


    renderBuy();

  };

document

    const message =

   DATE

   START
   ===================================================== */

startScreen.style.display =

workScreen.classList.remove(
